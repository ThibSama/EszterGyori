name: eszter-development

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ESZTER_DEV_DB_NAME:-eszter_dev}
      MYSQL_USER: ${ESZTER_DEV_DB_USERNAME:-eszter_dev}
      MYSQL_PASSWORD: ${ESZTER_DEV_DB_PASSWORD:-eszter_dev_only}
      MYSQL_ROOT_PASSWORD: ${ESZTER_DEV_DB_ROOT_PASSWORD:-eszter_root_dev_only}
    ports:
      - "127.0.0.1:${ESZTER_DEV_DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - eszter_mysql_dev:/var/lib/mysql

volumes:
  eszter_mysql_dev:
